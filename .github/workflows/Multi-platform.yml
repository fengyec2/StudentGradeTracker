name: Build on Multi-platforms

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select platform to build'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      matrix.os == github.event.inputs.platform
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Set up Python ${{ matrix.python-version || '3.10' }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version || '3.10' }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Linux (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python build_linux.py

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: python build_macos.py

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: python build_windows.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: out/
