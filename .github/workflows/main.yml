name: Build with Nuitka

on:
  push:
    branches: [ pyside6, pyqt5 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          ~\AppData\Local\pip\Cache
          ~\AppData\Local\Temp\pip*
          ${{ runner.temp }}\mingw64
        key: ${{ runner.os }}-${{ hashFiles('requirements.txt') }}-mingw64-14.2.0
        restore-keys: |
          ${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
          ${{ runner.os }}-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install MinGW64 (winlibs)
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.1-12.0.0-msvcrt-r2/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.1-mingw-w64msvcrt-12.0.0-r2.zip"
        $tempDir = "$env:TEMP\mingw64"
        New-Item -Path $tempDir -ItemType Directory -Force
        Invoke-WebRequest -Uri $url -OutFile "$tempDir\mingw64.zip"
        Expand-Archive -Path "$tempDir\mingw64.zip" -DestinationPath "$tempDir"
        echo "$tempDir\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        
    - name: Verify MinGW installation
      run: gcc --version
      
    - name: Run Nuitka build
      run: python build.py
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bundled-app
        path: out/entry.dist/**  # 上传整个目录结构